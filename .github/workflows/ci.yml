name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Builds every benchmark and runs tests/run_tests.sh (warnings,
      # sanitizers, golden checksums, known answers, valgrind).
      - run: nix flake check -L
